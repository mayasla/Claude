name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/expense-tracker-app-t2s2V', 'main']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Deploy to /test/ folder for feature branch, root for main
      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          clean-exclude: test

      - name: Deploy test
        if: github.ref != 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: test
